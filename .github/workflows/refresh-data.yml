name: Build reviewable data refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "13 7 1 * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OFI_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/build_data.py --refresh
      - run: python scripts/train.py
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-before-publication-snapshot
          path: |
            data/raw/
            data/processed/
            artifacts/forecast.json
            artifacts/model_evaluation.json
            artifacts/model_manifest.json
          retention-days: 30
