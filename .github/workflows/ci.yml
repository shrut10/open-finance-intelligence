name: Test and container smoke check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OFI_LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check web/app.js
      - run: pytest -q
      - name: Rebuild and evaluate licensed corpus offline
        run: python scripts/evaluate_rag.py
      - name: Build serving container
        run: docker build -t open-finance-intelligence:ci .
      - name: Smoke-test the actual image
        run: |
          docker run -d --name ofi -p 8000:8000 open-finance-intelligence:ci
          python scripts/smoke_test.py --attempts 20
      - name: Container logs
        if: failure()
        run: docker logs ofi || true

